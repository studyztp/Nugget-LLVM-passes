name: Daily LLVM Tip-of-Tree Test

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      # ── Install latest LLVM development snapshot from apt.llvm.org ───
      - name: Add LLVM apt repository
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          CODENAME=$(lsb_release -sc)
          echo "deb http://apt.llvm.org/${CODENAME}/ llvm-toolchain-${CODENAME} main" \
            | sudo tee /etc/apt/sources.list.d/llvm-dev.list
          sudo apt-get update

      - name: Detect latest LLVM version
        id: llvm-ver
        run: |
          VER=$(apt-cache search '^clang-[0-9]+$' \
                | grep -oP 'clang-\K[0-9]+' | sort -n | tail -1)
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "Detected latest LLVM development version: $VER"

      - name: Install LLVM packages
        run: |
          V=${{ steps.llvm-ver.outputs.ver }}
          sudo apt-get install -y --no-install-recommends \
            llvm-${V}-dev \
            clang-${V} \
            flang-${V} \
            lld-${V} \
            llvm-${V}-tools

      - name: Record LLVM version info
        id: llvm-info
        run: |
          V=${{ steps.llvm-ver.outputs.ver }}
          # Get the full version string (e.g. "23.0.0git" for dev builds)
          FULL_VER=$(/usr/lib/llvm-${V}/bin/llvm-config --version)
          echo "ver=$V"            >> "$GITHUB_OUTPUT"
          echo "full_ver=$FULL_VER" >> "$GITHUB_OUTPUT"
          echo "LLVM ${V} (${FULL_VER}) installed"
          echo "Binary dir: /usr/lib/llvm-${V}/bin"
          ls /usr/lib/llvm-${V}/bin/ | head -20

      # ── Build Nugget passes ───────────────────────────────────────────
      - name: Configure Nugget passes
        run: |
          V=${{ steps.llvm-ver.outputs.ver }}
          cmake -S . -B build \
            -DLLVM_DIR=/usr/lib/llvm-${V}/lib/cmake/llvm \
            -DENABLE_TESTS=ON \
            -DLLVM_BIN_DIR=/usr/lib/llvm-${V}/bin

      - name: Build Nugget passes
        run: cmake --build build

      # ── Run tests ─────────────────────────────────────────────────────
      - name: Run tests
        id: tests
        run: |
          set +e
          ctest --test-dir build --output-on-failure 2>&1 | tee test-output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          set -e

          # CTest summary line format:
          #   "100% tests passed, 0 tests failed out of 41"
          TOTAL=$(grep -oP '(?<=out of )\d+' test-output.txt | head -1)
          FAILED=$(grep -oP '\d+(?= tests? failed)' test-output.txt | head -1)
          TOTAL=${TOTAL:-0}
          FAILED=${FAILED:-0}
          PASSED=$((TOTAL - FAILED))

          echo "total=$TOTAL"         >> "$GITHUB_OUTPUT"
          echo "passed=$PASSED"       >> "$GITHUB_OUTPUT"
          echo "failed=$FAILED"       >> "$GITHUB_OUTPUT"
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

          # Capture per-test result lines
          grep -E '^\s*[0-9]+/[0-9]+ Test' test-output.txt > test-lines.txt || true

          exit "$EXIT_CODE"

      # ── Update README ─────────────────────────────────────────────────
      - name: Update README with test results
        if: always()
        env:
          LLVM_VERSION: ${{ steps.llvm-info.outputs.full_ver }}
          TEST_PASSED: ${{ steps.tests.outputs.passed }}
          TEST_FAILED: ${{ steps.tests.outputs.failed }}
          TEST_TOTAL: ${{ steps.tests.outputs.total }}
          TEST_EXIT: ${{ steps.tests.outputs.exit_code }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          python3 .github/workflows/update_readme_results.py

      - name: Commit updated README
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Update LLVM tip-of-tree test results [ci skip]"
          git push
